<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - iSAGI Shop and bulk</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            padding: 40px 0;
            align-items: start;
        }

        .product-detail-img {
            width: 100%;
            aspect-ratio: 1;
            background: var(--light-gray);
            border-radius: var(--radius-card);
            overflow: hidden;
        }

        .product-detail-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: multiply;
        }

        .product-detail-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .detail-lab {
            font-size: 0.9rem;
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .detail-price {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-text);
        }

        .detail-description {
            color: var(--secondary-text);
            line-height: 1.6;
        }

        .detail-actions {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--secondary-text);
            font-weight: 600;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--primary-text);
        }

        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .product-detail-img {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: var(--light-gray);
            border-radius: var(--radius-card);
            overflow: hidden;
            border: 1px solid var(--medium-gray);
        }

        .detail-thumbnails {
            display: flex;
            gap: 12px;
        }

        .detail-thumb {
            width: 80px;
            height: 80px;
            background: var(--light-gray);
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .detail-thumb.active {
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 4px 12px rgba(255, 198, 53, 0.2);
        }

        .detail-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: multiply;
        }

        .detail-thumb:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .gallery-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(0.9);
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, color 0.2s, transform 0.2s;
            z-index: 10;
            padding: 10px;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.35));
        }

        .gallery-nav-btn:hover {
            color: #ffffff;
            transform: translateY(-50%) scale(1.1);
        }

        .gallery-nav-btn.prev-btn {
            left: 12px;
        }

        .gallery-nav-btn.next-btn {
            right: 12px;
        }

        .product-detail-img:hover .gallery-nav-btn {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }

        .gallery-nav-btn svg {
            width: 28px;
            height: 28px;
            transition: transform 0.2s;
        }

        .gallery-nav-btn:active svg {
            transform: scale(0.85);
        }

        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }
    </style>
</head>
<body>
    <div id="mainHeader"></div>

    <!-- Cart Drawer (Same as Index) -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Tu Carrito</h3>
            <button class="icon-button" id="closeCart" data-tooltip="Cerrar carrito">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="cart-body" id="cartBody"></div>
        <div class="cart-footer">
            <div class="cart-row">
                <span>Subtotal:</span>
                <span id="cartSubtotalText">S/ 0.00</span>
            </div>
            <div class="cart-row">
                <span>IGV (18%):</span>
                <span id="cartTaxText">S/ 0.00</span>
            </div>
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotalText">S/ 0.00</span>
            </div>
            <div class="cart-footer-actions">
                <button class="add-btn btn-primary" id="checkoutBtn" data-tooltip="Finalizar compra">Finalizar Compra</button>
                <button id="clearCartBtn" class="clear-cart-btn-icon" data-tooltip="Vaciar carrito">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="container" style="padding-top: 40px;">
        <main class="product-page-main">
            <!-- Product Content -->
            <section class="store-content">
                <a href="index.html" class="back-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Volver a la tienda
                </a>

                <div id="productDetail">
                    <!-- Dynamic Detail Content -->
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { products } from './data.js';
        
        // This script will handle the logic for AND share the same cart as app.js
        // For simplicity in this demo, I'll ensure they use the same modular logic.
        // In a real app, cart logic should be in a separate cart.js
    </script>
    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">¿Vaciar carrito?</div>
            <div class="modal-text">Se eliminarán todos los productos de tu lista. Esta acción no se puede deshacer.</div>
            <div class="modal-actions">
                <button id="cancelModalBtn" class="modal-btn btn-cancel">Cancelar</button>
                <button id="confirmModalBtn" class="modal-btn btn-confirm">Vaciar Todo</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
